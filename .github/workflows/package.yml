name: Validate and package VSIX

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Build VSIX
        run: python3 scripts/package_vsix.py

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-panorama-viewer-${{ github.ref_name }}
          path: dist/*.vsix
          if-no-files-found: error
